<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <!-- <link rel="stylesheet" href="./signstyle.css"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='signstyle.css') }}">

</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <div id="message" class="error"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email:</label> <!-- fixed -->
                <input type="email" id="email" name="email" required> <!-- fixed -->
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <button id="submit" type="submit">Sign Up</button> <!-- added id="submit" -->
            </div>
            <a href="login.html" class="login">Already have an account? Login</a>
            <button id="google-login">Sign in with Google</button>

        </form>
    </div>

    <div class="background-effect"></div>

    <!-- <script type="module" src="./script1.js"></script> -->
    <script type="module" src="{{ url_for('static', filename='script1.js') }}"></script>

</body>
</html>
